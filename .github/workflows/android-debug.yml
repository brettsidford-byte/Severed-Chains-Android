name: Android debug APK

on:
  push:
    branches:
      - android-port
      - main
  pull_request:
    branches:
      - android-port
      - main
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # The bundled Android mod-loader is compiled for Java 21.
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's legacy default still includes the retired "tools"
          # package, which causes sdkmanager to fail on current runners.
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: severed-chains-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
